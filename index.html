<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Blackjack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="table">
    <header>
      <h1>Blackjack</h1>
      <p class="subtitle">Try to beat the dealer without going over 21.</p>
    </header>

    <section class="status">
      <div class="message" id="statusMessage">Click "New Round" to begin.</div>
      <div class="scoreboard">
        <span>Player: <strong id="playerTotal">0</strong></span>
        <span>Dealer: <strong id="dealerTotal">0</strong></span>
      </div>
    </section>

    <section class="hands">
      <div class="hand" aria-live="polite">
        <h2>Dealer</h2>
        <div class="cards" id="dealerCards"></div>
      </div>
      <div class="hand" aria-live="polite">
        <h2>Player</h2>
        <div class="cards" id="playerCards"></div>
      </div>
    </section>

    <section class="controls">
      <button id="newRound">New Round</button>
      <div class="actions">
        <button id="hit" disabled>Hit</button>
        <button id="stand" disabled>Stand</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
